# =============================================================================
#  Unity custom Gradle properties template
#  Enable: Player Settings > Publishing Settings > Custom Gradle Properties Template
#
#  GeckoView drags in a large AndroidX graph (core, lifecycle, media3,
#  play-services-fido). Without android.useAndroidX the Unity Gradle build fails
#  with "contains AndroidX dependencies, but the android.useAndroidX property is
#  not enabled" - the same error the plugin project hit.
#
#  The **TOKEN** markers are substituted at build time; keep them verbatim.
# =============================================================================
org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**

android.useAndroidX=true
android.enableJetifier=false

**ADDITIONAL_PROPERTIES**
